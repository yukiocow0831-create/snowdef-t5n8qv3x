function trimText(v){return String(v==null?'':v).replace(/^\s+|\s+$/g,'')}
function checkText(v,max,emptyOk){
  const text=trimText(v);
  if(!text)return emptyOk?{ok:true,value:''}:{ok:false,error:'空欄は送れません'};
  if(text.length>max)return {ok:false,error:max+'文字までにしてください'};
  return {ok:true,value:text};
}
function clientDispatch(store, action, body){
  const options=(store.options||[]).map(o=>Object.assign({},o));
  const votes=(store.votes||[]).map(v=>Object.assign({},v));
  const box={options:options,votes:votes};
  if(action==='get')return {ok:true,options:options,votes:votes};
  if(action==='vote')return clientVote(box,body||{});
  if(action==='voteBatch')return clientBatch(box,body||{});
  if(action==='addOption')return clientAdd(box,body||{});
  return {ok:false,error:'不明な操作です'};
}
function clientVote(store,body){
  const person=checkText(body.voterName,30,false);
  if(!person.ok)return {ok:false,error:'名前は30文字までです'};
  const category=trimText(body.category);
  if(['venue','date','golfPlan','golfCourse'].indexOf(category)<0)return {ok:false,error:'種類が正しくありません'};
  const optionId=trimText(body.optionId);
  if(!store.options.some(o=>o.category===category&&o.id===optionId))return {ok:false,error:'その候補は見当たりません'};
  const value=trimText(body.value);
  const now=new Date().toISOString();
  if(category==='golfPlan'){
    if(value!=='maru')return {ok:false,error:'ゴルフの予定は、どれか一つを選んでください'};
    const kept=store.votes.filter(v=>!(v.category==='golfPlan'&&v.voterName===person.value));
    kept.push({category:'golfPlan',optionId:optionId,voterName:person.value,value:'maru',updatedAt:now});
    store.votes=kept;
    return {ok:true,options:store.options,votes:store.votes};
  }
  if(value!=='maru'&&value!=='sankaku'&&value!=='batsu')return {ok:false,error:'○△×のどれかを選んでください'};
  const next=[];let replaced=false;
  store.votes.forEach(vote=>{
    const same=vote.category===category&&vote.optionId===optionId&&vote.voterName===person.value;
    if(!same){next.push(vote);return}
    replaced=true;
    if(vote.value===value)return;
    next.push({category:category,optionId:optionId,voterName:person.value,value:value,updatedAt:now});
  });
  if(!replaced)next.push({category:category,optionId:optionId,voterName:person.value,value:value,updatedAt:now});
  store.votes=next;
  return {ok:true,options:store.options,votes:store.votes};
}
function clientBatch(store,body){
  const person=checkText(body.voterName,30,false);
  if(!person.ok)return {ok:false,error:'名前は30文字までです'};
  const items=body.votes;
  if(!items||typeof items.length!=='number')return {ok:false,error:'送信の形が正しくありません'};
  if(items.length>80)return {ok:false,error:'回答が多すぎます'};
  const clean=[];const seen={};let golf=false;const now=new Date().toISOString();
  for(let i=0;i<items.length;i++){
    const item=items[i]||{};
    const category=trimText(item.category);
    if(['venue','date','golfPlan','golfCourse'].indexOf(category)<0)return {ok:false,error:'種類が正しくありません'};
    const optionId=trimText(item.optionId);
    if(!store.options.some(o=>o.category===category&&o.id===optionId))return {ok:false,error:'その候補は見当たりません'};
    const value=trimText(item.value);
    if(category==='golfPlan'){
      if(value!=='maru'||golf)return {ok:false,error:'ゴルフの予定は、どれか一つを選んでください'};
      golf=true;
    }else if(value!=='maru'&&value!=='sankaku'&&value!=='batsu')return {ok:false,error:'○△×のどれかを選んでください'};
    const key=category+'\n'+optionId;
    if(seen[key])return {ok:false,error:'同じ候補が重なっています'};
    seen[key]=true;
    clean.push({category:category,optionId:optionId,voterName:person.value,value:value,updatedAt:now});
  }
  store.votes=store.votes.filter(v=>v.voterName!==person.value).concat(clean);
  return {ok:true,options:store.options,votes:store.votes};
}
function clientAdd(store,body){
  const category=trimText(body.category);
  if(['venue','date','golfCourse'].indexOf(category)<0)return {ok:false,error:'この欄には候補を追加できません'};
  const label=checkText(body.label,60,false);
  if(!label.ok)return {ok:false,error:'候補の名前は60文字までです'};
  const note=checkText(body.note,100,true);
  if(!note.ok)return {ok:false,error:'メモは100文字までです'};
  const who=checkText(body.addedBy,30,false);
  if(!who.ok)return {ok:false,error:'名前は30文字までです'};
  if(store.options.filter(o=>o.category===category).length>=40)return {ok:false,error:'候補はこれ以上追加できません'};
  store.options.push({id:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),category:category,label:label.value,note:note.value,addedBy:who.value,createdAt:new Date().toISOString()});
  return {ok:true,options:store.options,votes:store.votes};
}

async function sendBatch(){
  if(sendBatch.busy)return;
  sendBatch.busy=true;
  const votes=[];
  Object.keys(choices.marks).forEach(key=>{
    const parts=key.split('|');
    if(data.options.some(o=>o.category===parts[0]&&o.id===parts[1]))votes.push({category:parts[0],optionId:parts[1],value:choices.marks[key]});
  });
  if(choices.plan&&data.options.some(o=>o.category==='golfPlan'&&o.id===choices.plan))votes.push({category:'golfPlan',optionId:choices.plan,value:'maru'});
  const body={action:'voteBatch',voterName:name,votes:votes};
  const base=gasUrl();
  const sending=$('sendVotes');
  if(sending)sending.textContent='送っています…';
  try{
    if(!base){
      const out=clientDispatch(demoLoad(),'voteBatch',body);
      if(!out.ok){fail(out.error||'送れませんでした');return}
      demoSave({options:out.options,votes:out.votes});
      data=demoLoad();
      succeed();
      return;
    }
    const res=await fetch(base,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    const json=await res.json();
    if(!json||json.ok===false){fail((json&&json.error)||'送れませんでした');return}
    data={options:json.options||[],votes:json.votes||[]};
    succeed();
  }catch(e){fail('電波のよいところで、もう一度送ってください。')}
  finally{sendBatch.busy=false}
}

function fromPoint(x,y){
  const stack=document.elementsFromPoint?document.elementsFromPoint(x,y):[document.elementFromPoint(x,y)];
  for(let i=0;i<stack.length;i++){
    const n=stack[i]&&stack[i].closest?stack[i].closest('button,a.share'):null;
    if(n)return n;
  }
  return null;
}
function handleUp(e){
  const src=(e.changedTouches&&e.changedTouches[0])||e;
  if(haveDown&&Math.hypot(src.clientX-downX,src.clientY-downY)>28){haveDown=false;return}
  haveDown=false;
  const btn=fromPoint(src.clientX,src.clientY);
  if(!btn||btn.tagName==='A')return;
  const now=Date.now(),key=actKey(btn);
  if(key===lastAct&&now-lastAt<400)return;
  lastAct=key;lastAt=now;
  runAct(btn);clickSound();
}
document.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;haveDown=true},{passive:true});
document.addEventListener('pointerup',e=>{ptrAt=Date.now();handleUp(e)});
document.addEventListener('click',e=>{
  const btn=e.target&&e.target.closest?e.target.closest('button'):null;
  if(!btn)return;
  const now=Date.now(),key=actKey(btn);
  if(key===lastAct&&now-lastAt<400)return;
  lastAct=key;lastAt=now;
  runAct(btn);clickSound();
});
document.addEventListener('touchstart',e=>{
  if(window.PointerEvent)return;
  const t=e.touches&&e.touches[0];if(!t)return;
  downX=t.clientX;downY=t.clientY;haveDown=true;
},{passive:true});
document.addEventListener('touchend',e=>{if(window.PointerEvent&&Date.now()-ptrAt<400)return;handleUp(e)},{passive:true});
$('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();enterName()}});
$('lineShare').href=LINE;
$('demoBanner').hidden=!!gasUrl();
name=loadName();
if(name)$('nameInput').value=name;
beginFresh();
setInterval(()=>{if(gasUrl()&&screen==='results'&&$('addDialog').hidden)refresh(false)},30000);
window.__dousoukaiSeed=SEED;
window.__dousoukaiDispatch=clientDispatch;
})();
